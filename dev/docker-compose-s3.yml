services:
  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - "./config/garage.toml:/etc/garage.toml:ro"
    ports:
      - 3910:3910
  garage-init:
    image: alpine:3.20
    volumes:
      - "./config/garage-init.sh:/garage-init.sh:ro"
    command: sh /garage-init.sh
    depends_on:
      - garage
