[tools]
java = "temurin-21"
sbt = "1.12"
node = "24"
"github:F1bonacc1/process-compose" = "1"

[tasks."install:doc"]
dir = "manual"
run = "npm install"

[tasks."install:playwright"]
dir = "daikoku/javascript"
run = "npx playwright install chromium"

[tasks."install:frontdeps"]
dir = "daikoku/javascript"
run = "npm install"

[tasks."install:front"]
dir = "daikoku/javascript"
run = [{task = "install:frontdeps"}, {task = "install:playwright"},  {task = "install:doc"}]


[tasks."install:back"]
run = "docker-compose -f dev/docker-compose-light.yml pull && cd daikoku && sbt compile"

[tasks.install]
run = [{task = "install:front"}, {task = "install:back"}]

[tasks."dev:containers"]
dir = "dev"
run = "docker-compose -f docker-compose-light.yml rm -f && docker-compose --ansi=always -f docker-compose-light.yml up"

[tasks."dev:clean"]
dir = "dev"
run = "docker-compose -f docker-compose-light.yml down && docker-compose -f docker-compose-light.yml rm -f"

[tasks."dev:front"]
dir = "daikoku/javascript"
run = "FORCE_COLOR=1 npm run dev"

[tasks."dev:back"]
dir = "daikoku"
run = "sbt --color=true -jvm-debug 5005 \"~run -Dconfig.resource=local.conf -Ddaikoku.init.data.from=../dev/config/daikoku_state_light.ndjson\""
raw=true

[tasks."dev:back:empty"]
dir = "daikoku"
run = "sbt --color=true -jvm-debug 5005 \"~run -Dconfig.resource=local.conf\""
raw=true

[tasks.dev]
run = "process-compose -f ./dev/process-compose.yaml -p 9999"

[tasks."dev:empty"]
run = "process-compose -f ./dev/process-compose-dev-empty.yaml -p 9999"

[tasks.doc]
dir = "manual"
run = "npm start"

[tasks."test:back:containers"]
dir = "daikoku/javascript/tests"
run = "docker-compose -f docker-compose-test-backend.yml  rm -f && docker-compose -f docker-compose-test-backend.yml up"

#dir = "javascript/tests/config/daikoku/daikoku_state_local_test.ndjson"

[tasks."test:front:ldap:containers"]
dir="daikoku/javascript/tests"
run = "docker-compose -f docker-compose-local-pg.yml rm -f && docker-compose --ansi=always -f docker-compose-local-pg.yml up"

[tasks."test:front:oidc:containers"]
dir="dev"
run = "docker-compose -f docker-compose-oidc-pg.yml rm -f && docker-compose --ansi=always -f docker-compose-oidc-pg.yml up"

[tasks."test:front:ldap:backend"]
dir="daikoku"
run = "DAIKOKU_INIT_ADMIN_PASSWORD=password DAIKOKU_OTOROSHI_SYNC_CRON=false DAIKOKU_TENANT_PROVIDER=hostname DAIKOKU_EXPOSED_ON=5173 DAIKOKU_INIT_DATA_FROM=javascript/tests/config/daikoku/daikoku_state_local_test.ndjson DAIKOKU_MODE=dev DAIKOKU_HEALTH_ACCESS_KEY=secret sbt \"~run\" --color=true"

# Same as the ldap backend but with the sync/stats cron ON (DAIKOKU_OTOROSHI_SYNC_CRON
# drives both otoroshi.sync.cron and stats.sync.cron) — needed by the consumption/stripe
# stacks so the stats sync job is active.
[tasks."test:stack:backend"]
dir="daikoku"
run = "DAIKOKU_INIT_ADMIN_PASSWORD=password DAIKOKU_OTOROSHI_SYNC_CRON=true DAIKOKU_TENANT_PROVIDER=hostname DAIKOKU_EXPOSED_ON=5173 DAIKOKU_INIT_DATA_FROM=javascript/tests/config/daikoku/daikoku_state_local_test.ndjson DAIKOKU_MODE=dev DAIKOKU_HEALTH_ACCESS_KEY=secret sbt \"~run\" --color=true"

[tasks."test:front:oidc:backend"]
dir="daikoku"
run = "DAIKOKU_INIT_ADMIN_PASSWORD=password DAIKOKU_OTOROSHI_SYNC_CRON=false DAIKOKU_TENANT_PROVIDER=hostname DAIKOKU_EXPOSED_ON=5173 DAIKOKU_INIT_DATA_FROM=../dev/config/daikoku_state_oidc.ndjson DAIKOKU_MODE=dev DAIKOKU_HEALTH_ACCESS_KEY=secret sbt \"~run\" --color=true"

[tasks."test:front:ldap:clean"]
dir="daikoku/javascript/tests"
run = "docker-compose -f docker-compose-local-pg.yml down && docker-compose -f docker-compose-local-pg.yml rm -f"

# ES overlay for the consumption/stripe stacks: same containers as the front tests plus
# Elasticsearch (see docker-compose-es.yml). The base front stack stays ES-free.
[tasks."test:es:containers"]
dir = "daikoku/javascript/tests"
run = "docker-compose -f docker-compose-local-pg.yml -f docker-compose-es.yml rm -f && docker-compose --ansi=always -f docker-compose-local-pg.yml -f docker-compose-es.yml up"

[tasks."test:es:clean"]
dir = "daikoku/javascript/tests"
run = "docker-compose -f docker-compose-local-pg.yml -f docker-compose-es.yml down && docker-compose -f docker-compose-local-pg.yml -f docker-compose-es.yml rm -f"

[tasks."test:front:oidc:clean"]
dir="dev"
run = "docker-compose -f docker-compose-oidc-pg.yml down && docker-compose -f docker-compose-oidc-pg.yml rm -f"

[tasks."test:front:ldap:run"]
dir="daikoku/javascript"
run="FORCE_COLOR=1 npx playwright test --trace on --workers 1 --config ./tests/playwright.config.js --ui --project chromium"

[tasks."test:front:oidc:run"]
dir="daikoku/javascript"
run="FORCE_COLOR=1 npx playwright test --trace on --workers 1 --config ./tests/playwright.oidc.config.js --ui --project chromium"

[tasks."test:front:ldap"]
dir="dev"
run="process-compose -f process-compose-test-front-ldap.yaml -p 9999"

[tasks."test:front:oidc"]
dir="dev"
run="process-compose -f process-compose-test-front-oidc.yaml -p 9999"

[tasks."seed:update"]
run = "scripts/update-seeds.sh \"${DAIKOKU_URL:-http://localhost:9000}\" \"${ADMIN_USERNAME:-admin@foo.bar}\" \"${ADMIN_PASS:-password}\" \"${TENANT_ID:-default}\""

[tasks."test:front:report"]
dir="daikoku/javascript"
run = "npx playwright show-report tests/playwright-report"

[tasks."test:back:clean"]
dir = "daikoku/javascript/tests"
run = "docker-compose -f docker-compose-test-backend.yml down && docker-compose -f docker-compose-test-backend.yml rm -f"

[tasks."test:back"]
run = "process-compose -f ./dev/process-compose-test.yaml -p 9999"


[tasks.tests]
run = [{task = "test:front"}, {task = "test:back"}]

# --- Stripe metered-billing e2e (dev only, real Stripe test mode) ---
# Needs daikoku/.env.stripe (gitignored) with your Stripe test keys. Node pinned to 22
# for this run only (Playwright's JSON imports break on Node 23+).

[tasks."test:stripe:run"]
dir = "daikoku/javascript"
tools.node = "22"
run = "[ -f ../.env.stripe ] && . ../.env.stripe; FORCE_COLOR=1 npx playwright test stripe_billing --trace on --workers 1 --config ./tests/playwright.config.js"

# One-shot: brings up the local stack (Daikoku from source + Otoroshi/mailhog/pg) and runs
# the Stripe spec against it.
[tasks."test:stripe"]
run = "process-compose -f ./dev/process-compose-test-stripe.yaml -p 9999"

# --- Consumption pipeline (Otoroshi -> ES -> Daikoku), no Stripe ---
[tasks."test:consumption:run"]
dir = "daikoku/javascript"
tools.node = "22"
run = "FORCE_COLOR=1 npx playwright test consumption_sync --trace on --workers 1 --config ./tests/playwright.config.js"

[tasks."test:consumption"]
run = "process-compose -f ./dev/process-compose-test-consumption.yaml -p 9999"
