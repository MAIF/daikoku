# ES overlay for the consumption/stripe stacks only. Layered on top of
# docker-compose-local.yml, which those stacks start without its daikoku service since
# they run Daikoku from source:
#   docker-compose -f docker-compose-local.yml -f docker-compose-es.yml up \
#     faker smtp redis elastic otoroshi
# Adds Elasticsearch, makes Otoroshi wait for it to be healthy (so Otoroshi applies its
# ES index template before indexing any event), and points Otoroshi at the ES-enabled
# state. The base stack (front tests) stays ES-free.
services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    networks:
      - basicsetup
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    expose:
      - 9200
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  otoroshi:
    # Pinned here rather than in the shared compose file: the front tests stay on
    # latest, while the billing runs need a version whose behaviour does not move
    # under them between two runs.
    image: maif/otoroshi:17.17.0
    environment:
      - OTOROSHI_IMPORT_FROM=/usr/app/otoroshi/imports/otoroshi-state-es.json
    depends_on:
      elastic:
        condition: service_healthy
