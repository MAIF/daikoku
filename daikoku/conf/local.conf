include "base.conf"

daikoku {
  flags {
    multiPlanSubscriptionEnabled = true
  }

  mode = "dev"
  signingKey = "secret"
  storage = "postgres"
  exposedOn= 5173

  health {
    accessKey = "secret"
  }

  otoroshi {
    sync {
      cron = true
    }
  }

  notificationsPurgeJob {
    enabled = true
    interval = 1hour
    mode = "interval"
    key = "secret"
    max.to.treat.date = 1days
    max.base.date = 1days
  }

  auditTrailPurgeJob {
      enabled = true
      interval = 1hour
      mode = "interval"
      key = "secret"
      max.date = 10minutes
    }

  postgres {
    database = "daikoku"
  }


  tenants {
    provider = "hostname"
  }
}
