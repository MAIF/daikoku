include "base.conf"

daikoku {
  flags {
    multiPlanSubscriptionEnabled = true
  }

  mode = "dev"
  signingKey = "secret"
  storage = "postgres"
  exposedOn= 5173

  health {
    accessKey = "secret"
  }

  otoroshi {
    sync {
      cron = true
    }
  }

  deletion {
    interval = 1 second
  }

  postgres {
    database = "daikoku"
  }


  tenants {
    provider = "hostname"
  }
}
